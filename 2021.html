<style>

    --card: #FFFFFF;

  @media (prefers-color-scheme: dark) {

      --paper: #0F1B24;
      --ink: #E6ECEF;
      --muted: #93A1AB;
      --line: #4C5C68;
      --band12: rgba(230, 236, 239, 0.08);

      --rule: rgba(230, 236, 239, 0.45);
      --pylon: #FF7A33;
      --card: #172631;

  body {

    color: var(--ink);
    font: 400 15px/1.5 "Barlow", system-ui, sans-serif;
  }
  header {
    max-width: 1180px;
    margin: 0 auto;
    padding: 36px 16px 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: space-between;
    gap: 16px;
  }
  h1 {
    margin: 0;
    font: 700 clamp(30px, 5vw, 48px)/1 "Barlow Condensed", sans-serif;
    letter-spacing: -0.01em;
  }
  .lede { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }
  .find { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; }
  .meta { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .find select {
    font: 500 15px "Barlow", sans-serif;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 6px;
    padding: 7px 10px;
  }
  .find select:focus-visible { outline: 2px solid var(--pylon); outline-offset: 1px; }
  .find input {
    font: 500 15px "Barlow", sans-serif;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 6px;
    padding: 7px 10px;
    width: 220px;
  }
  .find input:focus-visible { outline: 2px solid var(--pylon); outline-offset: 1px; }
  .scroller { max-width: 1180px; margin: 0 auto; padding: 0 16px; overflow-x: auto; }
  svg { display: block; }
  .week-label { font: 600 13px "Barlow Condensed", sans-serif; fill: var(--muted); }
  .team-label { font: 600 14px "Barlow Condensed", sans-serif; fill: var(--ink); }
  .team-label .rk { fill: var(--muted); font-weight: 500; }
  .cut-label { font: 600 12px "Barlow Condensed", sans-serif; fill: var(--muted); }
  .cut-rule { stroke: var(--rule); stroke-dasharray: 4 4; stroke-width: 1; }
  .track { fill: none; stroke: var(--line); stroke-width: 2; stroke-opacity: 0.7;
           transition: stroke-opacity 120ms, stroke-width 120ms; }
  .dot { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
  /* Shade each line by where the team finishes: the 12-team field reads darkest. */
  .tier1 .track { stroke: var(--ink); stroke-opacity: 0.55; }
  .tier1 .dot { stroke: var(--ink); stroke-opacity: 0.7; }
  .tier3 .track { stroke-opacity: 0.4; }
  .dim .track { stroke-opacity: 0.18; }
  .dim .dot, .dim .team-label { opacity: 0.25; }
  .on .track { stroke: var(--pylon); stroke-opacity: 1; stroke-width: 3.5; }
  .on .dot { stroke: var(--pylon); fill: var(--pylon); opacity: 1; }
  .on .team-label { opacity: 1; fill: var(--pylon); }
  .pinned .track { stroke: var(--ink); stroke-opacity: 0.85; stroke-width: 3; }
  .pinned .dot { stroke: var(--ink); opacity: 1; }
  .pinned .team-label { opacity: 1; }
  .tip {
    position: fixed;
    pointer-events: none;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    padding: 12px 14px;
    width: 270px;
    box-shadow: 0 6px 24px rgba(15, 27, 36, 0.18);
    font-size: 13px;
    opacity: 0;
    transition: opacity 80ms;
  }
  .tip.show { opacity: 1; }
  .tip h2 { margin: 0; font: 700 22px/1.1 "Barlow Condensed", sans-serif; }
  .tip .when { margin: 2px 0 10px; color: var(--muted); }
  .tip .move-up { color: #1F8A4C; }
  .tip .move-down { color: #C2410C; }
  .tip dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; }
  .tip dt { color: var(--muted); }
  .tip dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tip dd .sub { color: var(--muted); font-weight: 500; }
  .tip .note { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .scroller { padding-bottom: 40px; }
  @media (prefers-reduced-motion: reduce) { .track, .tip { transition: none; } }
</style>

  </div>
</header>
<div class="scroller"><svg id="chart" role="img" aria-label="Bump chart of weekly rankings"></svg></div>

ant": "FCS (69\u20137)", "worst": "Kent State"}, {"rating": 0.46, "wl": "4-4", "sos": 0.66, "sosRank": 114, "winSev": 0.49, "final": 1.6, "half": 0.4, "epa": 0.01, "best": "Old Dominion", "dominant": "FCS (69\u20137)", "worst": "Kent State"}, {"rating": 0.41, "wl": "4-5", "sos": 0.66, "sosRank": 116, "winSev": 0.47, "final": 0.1, "half": -1.7, "epa": -0.05, "best": "Old Dominion", "dominant": "FCS (69\u20137)", "worst": "Bowling Green"}, {"rating": 0.45, "wl": "4-5", "sos": 0.71, "sosRank": 117, "winSev": 0.46, "final": 0.1, "half": -1.7, "epa": -0.05, "best": "Old Dominion", "dominant": "FCS (69\u20137)", "worst": "Bowling Green"}, {"rating": 0.4, "wl": "4-6", "sos": 0.69, "sosRank": 119, "winSev": 0.45, "final": -2.6, "half": -4.2, "epa": -0.1, "best": "Ohio", "dominant": "FCS (69\u20137)", "worst": "Bowling Green"}, {"rating": 0.38, "wl": "4-7", "sos": 0.75, "sosRank": 116, "winSev": 0.44, "final": -2.9, "half": -4.4, "epa": -0.11, "best": "Old Dominion", "dominant": "FCS (69\u20137)", "worst": "Bowling Green"}, {"rating": 0.37, "wl": "4-8", "sos": 0.78, "sosRank": 113, "winSev": 0.43, "final": -4.1, "half": -5.4, "epa": -0.12, "best": "Old Dominion", "dominant": "FCS (69\u20137)", "worst": "Bowling Green"}, {"rating": 0.39, "wl": "4-8", "sos": 0.79, "sosRank": 115, "winSev": 0.42, "final": -4.1, "half": -5.4, "epa": -0.12, "best": "Old Dominion", "dominant": "FCS (69\u20137)", "worst": "Bowling Green"}, {"rating": 0.39, "wl": "4-8", "sos": 0.79, "sosRank": 116, "winSev": 0.41, "final": -4.1, "half": -5.4, "epa": -0.12, "best": "Old Dominion", "dominant": "FCS (69\u20137)", "worst": "Bowling Green"}, {"rating": 0.42, "wl": "4-8", "sos": 0.79, "sosRank": 119, "winSev": 0.37, "final": -4.1, "half": -5.4, "epa": -0.12, "best": "Old Dominion", "dominant": "FCS (69\u20137)", "worst": "Bowling Green"}]}], "updated": "2022-01-11", "years": [2026, 2025, 2024, 2023, 2022, 2021]};

const weeks = DATA.weeks;
const TOP = DATA.top;
const teams = DATA.teams;
const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
const signed = (x, d) => x == null ? "—" : (x > 0 ? "+" : "") + x.toFixed(d);
const num = (x, d) => x == null ? "—" : x.toFixed(d);

const row = 22, padTop = 34, padBottom = 18;
const strip = 26, leftLabels = 132, rightLabels = 150;
const colW = Math.max(52, Math.min(78, 860 / Math.max(1, weeks.length - 1)));
const plotW = colW * Math.max(1, weeks.length - 1);
const width = strip + leftLabels + plotW + rightLabels;
const height = padTop + row * TOP + padBottom;

const x = i => strip + leftLabels + i * colW;
const y = r => padTop + (r - 0.5) * row;
const bottom = padTop + TOP * row;

const svg = d3.select("#chart").attr("width", width).attr("height", height)
  .attr("viewBox", `0 0 ${width} ${height}`);

// Playoff bands and cutoff rules.
const bands = [[0, DATA.cutoffs[0], "var(--band12)"], [DATA.cutoffs[0], DATA.cutoffs[1], "var(--band24)"]];
svg.append("g").selectAll("rect").data(bands).join("rect")
  .attr("x", strip).attr("width", width - strip)
  .attr("y", d => padTop + d[0] * row).attr("height", d => (d[1] - d[0]) * row)
  .attr("fill", d => d[2]);
const cutText = { [DATA.cutoffs[0]]: "12-team playoff (2026)", [DATA.cutoffs[1]]: "24-team playoff (2027)" };
const cuts = svg.append("g");
DATA.cutoffs.forEach((c, i) => {
  const yy = padTop + c * row;
  cuts.append("line").attr("class", "cut-rule").attr("x1", strip).attr("x2", width).attr("y1", yy).attr("y2", yy);
  const top = i === 0 ? padTop : padTop + DATA.cutoffs[i - 1] * row;
  cuts.append("text").attr("class", "cut-label")
    .attr("transform", `translate(${strip - 9},${(top + yy) / 2}) rotate(-90)`)
    .attr("text-anchor", "middle").text(cutText[c]);
});

svg.append("g").selectAll("text").data(weeks).join("text")
  .attr("class", "week-label").attr("x", (d, i) => x(i)).attr("y", 18)
  .attr("text-anchor", "middle").text(d => d);

svg.append("defs").append("clipPath").attr("id", "plot-clip")
  .append("rect").attr("x", 0).attr("y", 0).attr("width", width).attr("height", bottom + 2);

const line = d3.line().x(d => x(d.i)).y(d => y(Math.min(d.r, TOP + 4))).curve(d3.curveBumpX);
const layer = svg.append("g").attr("class", "teams");
const last = weeks.length - 1;
const tier = d => d.ranks[last] <= DATA.cutoffs[0] ? "tier1" : d.ranks[last] <= DATA.cutoffs[1] ? "tier2" : "tier3";
const groups = layer.selectAll("g.team").data(teams, d => d.team).join("g")
  .attr("class", d => "team " + tier(d));

groups.append("path").attr("class", "track").attr("clip-path", "url(#plot-clip)")
  .attr("d", d => {
    // Draw each run of weeks that touches the top 30, so a team that leaves dives out of view.
    const pts = d.ranks.map((r, i) => ({ r, i }));
    const keep = pts.filter((p, i) => p.r <= TOP || (pts[i - 1] && pts[i - 1].r <= TOP) || (pts[i + 1] && pts[i + 1].r <= TOP));
    const runs = [];
    keep.forEach(p => {
      const last = runs[runs.length - 1];
      if (last && last[last.length - 1].i === p.i - 1) last.push(p); else runs.push([p]);
    });
    return runs.map(run => line(run)).join("");
  });

groups.selectAll("circle").data(d => d.ranks.map((r, i) => ({ r, i })).filter(p => p.r <= TOP))
  .join("circle").attr("class", "dot").attr("r", 3.2).attr("cx", p => x(p.i)).attr("cy", p => y(p.r));

function label(g, i, anchor, dx) {
  g.filter(d => d.ranks[i] <= TOP).append("text").attr("class", "team-label")
    .attr("x", x(i) + dx).attr("y", d => y(d.ranks[i])).attr("dy", "0.35em").attr("text-anchor", anchor)
    .call(t => {
      if (anchor === "start") {
        t.append("tspan").attr("class", "rk").text(d => d.ranks[i] + "  ");
        t.append("tspan").text(d => d.team);
      } else {
        t.append("tspan").text(d => d.team);
        t.append("tspan").attr("class", "rk").text(d => "  " + d.ranks[i]);
      }
    });
}
label(groups, 0, "end", -10);
label(groups, weeks.length - 1, "start", 10);

// Hover: nearest week dot to the pointer.
const pts = [];
teams.forEach((t, ti) => t.ranks.forEach((r, i) => { if (r <= TOP) pts.push({ ti, i, px: x(i), py: y(r) }); }));
const delaunay = d3.Delaunay.from(pts, p => p.px, p => p.py);
const tip = document.getElementById("tip");
const pinned = new Set();
let hovered = null;

function paint() {
  const any = hovered != null || pinned.size > 0;
  groups.classed("dim", d => any && d.team !== hovered && !pinned.has(d.team))
    .classed("on", d => d.team === hovered)
    .classed("pinned", d => pinned.has(d.team) && d.team !== hovered);
  groups.filter(d => d.team === hovered || pinned.has(d.team)).raise();
}

function showTip(p, ev) {
  const t = teams[p.ti], s = t.stats[p.i], r = t.ranks[p.i];
  const prev = p.i > 0 ? t.ranks[p.i - 1] : null;
  let move = "";
  if (prev != null && prev !== r) {
    const up = prev > r;
    move = ` <span class="${up ? "move-up" : "move-down"}">(${up ? "up" : "down"} ${Math.abs(prev - r)})</span>`;
  }
  const when = weeks[p.i] === "Final" ? "Final" : "After " + weeks[p.i].replace("Wk", "week");
  tip.innerHTML = `
    <h2></h2>
    <p class="when">${when}, ranked ${ord(r)}${move}</p>
    <dl>
      <dt>Rating</dt><dd>${num(s.rating, 2)}</dd>
      <dt>Record</dt><dd>${s.wl}</dd>
      <dt>Strength of schedule</dt><dd>${num(s.sos, 2)}${s.sosRank ? ` <span class="sub">(${ord(s.sosRank)})</span>` : ""}</dd>
      <dt>Average win severity</dt><dd>${num(s.winSev, 2)}</dd>
      <dt>Final margin per game</dt><dd>${signed(s.final, 1)}</dd>
      <dt>First-half margin</dt><dd>${signed(s.half, 1)}</dd>
      <dt>EPA per play margin</dt><dd>${signed(s.epa, 2)}</dd>
      <dt>Best win</dt><dd class="best"></dd>
      <dt>Most dominant win</dt><dd class="dominant"></dd>
      <dt>Worst loss</dt><dd class="worst"></dd>
    </dl>
    <p class="note">Rating 1.00 is an average team. Schedule 1.00 is an average FBS schedule. Margins are capped at 28.</p>`;
  tip.querySelector("h2").textContent = t.team;
  tip.querySelector(".best").textContent = s.best || "—";
  tip.querySelector(".dominant").textContent = s.dominant || "—";
  tip.querySelector(".worst").textContent = s.worst || "—";
  const pad = 16, w = tip.offsetWidth, h = tip.offsetHeight;
  let left = ev.clientX + pad, top = ev.clientY + pad;
  if (left + w > innerWidth - 8) left = ev.clientX - w - pad;
  if (top + h > innerHeight - 8) top = Math.max(8, innerHeight - h - 8);
  tip.style.left = left + "px";
  tip.style.top = top + "px";
  tip.classList.add("show");
}

function hide() { hovered = null; tip.classList.remove("show"); paint(); }

svg.append("rect").attr("width", width).attr("height", height).attr("fill", "transparent")
  .on("pointermove", ev => {
    const [mx, my] = d3.pointer(ev);
    const k = delaunay.find(mx, my);
    const p = pts[k];
    if (!p || Math.hypot(p.px - mx, p.py - my) > 28) return hide();
    hovered = teams[p.ti].team;
    paint();
    showTip(p, ev);
  })
  .on("pointerleave", hide)
  .on("click", () => {
    if (!hovered) return;
    pinned.has(hovered) ? pinned.delete(hovered) : pinned.add(hovered);
    paint();
  });

if (DATA.years && DATA.years.length > 1) {
  const sel = document.getElementById("season");
  DATA.years.forEach(y => { const o = document.createElement("option"); o.value = y; o.textContent = y; sel.append(o); });
  sel.value = DATA.year;
  sel.addEventListener("change", () => { location.href = sel.value + ".html"; });
  document.getElementById("season-wrap").hidden = false;
}
const lastStop = weeks[weeks.length - 1];
document.getElementById("meta").textContent =
  (lastStop === "Final" ? "Final rankings, after the bowls and playoff." : `Through ${lastStop.replace("Wk", "week")}.`) +
  (DATA.updated ? ` Last game counted: ${DATA.updated}.` : "");

const list = document.getElementById("team-list");
teams.map(t => t.team).sort().forEach(n => { const o = document.createElement("option"); o.value = n; list.append(o); });
document.getElementById("find").addEventListener("keydown", e => {
  if (e.key === "Escape") { pinned.clear(); e.target.value = ""; paint(); return; }
  if (e.key !== "Enter") return;
  const q = e.target.value.trim().toLowerCase();
  const hit = teams.find(t => t.team.toLowerCase() === q) || teams.find(t => t.team.toLowerCase().startsWith(q));
  if (hit) { pinned.add(hit.team); e.target.value = ""; paint(); }
});
</script>
