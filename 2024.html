  body {

  .find select {
    font: 500 15px "Barlow", sans-serif;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 6px;
    padding: 7px 10px;
  }
  .find select:focus-visible { outline: 2px solid var(--pylon); outline-offset: 1px; }
  .find input {
    font: 500 15px "Barlow", sans-serif;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 6px;
    padding: 7px 10px;
    width: 220px;
  }
  .find input:focus-visible { outline: 2px solid var(--pylon); outline-offset: 1px; }
  .scroller { max-width: 1180px; margin: 0 auto; padding: 0 16px; overflow-x: auto; }
  svg { display: block; }
  .week-label { font: 600 13px "Barlow Condensed", sans-serif; fill: var(--muted); }
  .team-label { font: 600 14px "Barlow Condensed", sans-serif; fill: var(--ink); }
  .team-label .rk { fill: var(--muted); font-weight: 500; }
  .cut-label { font: 600 12px "Barlow Condensed", sans-serif; fill: var(--muted); }
  .cut-rule { stroke: var(--rule); stroke-dasharray: 4 4; stroke-width: 1; }
  .track { fill: none; stroke: var(--line); stroke-width: 2; stroke-opacity: 0.7;
           transition: stroke-opacity 120ms, stroke-width 120ms; }
  .dot { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
  /* Shade each line by where the team finishes: the 12-team field reads darkest. */
  .tier1 .track { stroke: var(--ink); stroke-opacity: 0.55; }
  .tier1 .dot { stroke: var(--ink); stroke-opacity: 0.7; }
  .tier3 .track { stroke-opacity: 0.4; }
  .dim .track { stroke-opacity: 0.18; }
  .dim .dot, .dim .team-label { opacity: 0.25; }
  .on .track { stroke: var(--pylon); stroke-opacity: 1; stroke-width: 3.5; }
  .on .dot { stroke: var(--pylon); fill: var(--pylon); opacity: 1; }
  .on .team-label { opacity: 1; fill: var(--pylon); }
  .pinned .track { stroke: var(--ink); stroke-opacity: 0.85; stroke-width: 3; }
  .pinned .dot { stroke: var(--ink); opacity: 1; }
  .pinned .team-label { opacity: 1; }
  .tip {
    position: fixed;
    pointer-events: none;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    padding: 12px 14px;
    width: 270px;
    box-shadow: 0 6px 24px rgba(15, 27, 36, 0.18);
    font-size: 13px;
    opacity: 0;
    transition: opacity 80ms;
  }
  .tip.show { opacity: 1; }
  .tip h2 { margin: 0; font: 700 22px/1.1 "Barlow Condensed", sans-serif; }
  .tip .when { margin: 2px 0 10px; color: var(--muted); }
  .tip .move-up { color: #1F8A4C; }
  .tip .move-down { color: #C2410C; }
  .tip dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; }
  .tip dt { color: var(--muted); }
  .tip dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tip dd .sub { color: var(--muted); font-weight: 500; }
  .tip .note { margin: 10px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .scroller { padding-bottom: 40px; }
  @media (prefers-reduced-motion: reduce) { .track, .tip { transition: none; } }
</style>

</header>

document.getElementById("meta").textContent =
  (lastStop === "Final" ? "Final rankings, after the bowls and playoff." : `Through ${lastStop.replace("Wk", "week")}.`) +
  (DATA.updated ? ` Last game counted: ${DATA.updated}.` : "");

const list = document.getElementById("team-list");
teams.map(t => t.team).sort().forEach(n => { const o = document.createElement("option"); o.value = n; list.append(o); });
document.getElementById("find").addEventListener("keydown", e => {
  if (e.key === "Escape") { pinned.clear(); e.target.value = ""; paint(); return; }
  if (e.key !== "Enter") return;
  const q = e.target.value.trim().toLowerCase();
  const hit = teams.find(t => t.team.toLowerCase() === q) || teams.find(t => t.team.toLowerCase().startsWith(q));
  if (hit) { pinned.add(hit.team); e.target.value = ""; paint(); }
});
</script>
</body>
</html>
